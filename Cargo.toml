[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/spool", "crates/rt", "crates/tracker", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bf-core = { path = "crates/core" }
bf-db = { path = "crates/db" }
bf-spool = { path = "crates/spool" }
bf-rt = { path = "crates/rt" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
proptest = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono"] }
crc32fast = "1.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
arc-swap = "1"
woothee = "0.13"
sha2 = "0.10"
