global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  # deploy/docker-compose.yml sets BF_METRICS_ADDR per service (tracker 9100, api 9101) on the
  # compose network only. With BF_METRICS_TOKEN set, add `authorization: {credentials: <token>}`
  # to each job (see docs/ops/alerts.md).
  - job_name: bf-tracker
    static_configs:
      - targets: ["tracker:9100"]
  - job_name: bf-api
    static_configs:
      - targets: ["api:9101"]
