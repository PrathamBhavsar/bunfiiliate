route:
  receiver: bf-webhook
  group_by: [alertname]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: bf-webhook
    webhook_configs:
      - url: http://api:8080/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Same value as BF_ALERT_TOKEN on the api. Mounted file, never inline.
            credentials_file: /etc/alertmanager/alert-token
  # Optional extra receivers (not enabled; add to `route.routes` to use):
  # - name: ops-slack
  #   slack_configs: [{api_url_file: /etc/alertmanager/slack-url, channel: "#ops"}]
  # - name: ops-email
  #   email_configs: [{to: ops@example.com, from: bf@example.com, smarthost: "smtp:587"}]
